on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

name: Go
jobs:
  test:
    strategy:
      matrix:
        go-version: ["1.25.x", "oldstable", "stable"]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Download Go dependencies
        env:
          GOPROXY: "https://proxy.golang.org"
        run: go mod download
      - name: Test with -race
        run: go test -race -count=1 ./...
      - name: Integration test
        if: matrix.platform == 'ubuntu-latest' && startsWith(matrix.go-version, 'stable')
        run: |
          sudo modprobe nfnetlink_queue
          sudo ip6tables -I OUTPUT -p ipv6-icmp -j NFQUEUE --queue-num 100
          sudo iptables -I OUTPUT -p icmp -j NFQUEUE --queue-num 100
          go test -v -tags integration -exec=sudo -count=1 ./...
  code-base:
    name: code base
    runs-on: ubuntu-24.04
    steps:
      - name: Clone code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: lint
        run: |
          make lint
      - name: fmt
        run: |
          make fmt
